# Базовый конфиг одного WARP-контейнера (пул warp1..warpN — каждый со своим exit-IP)
x-warp-base: &warp-base
  # v7 (ядро sing-box): в v5 сломалась регистрация — API Cloudflare стал отдавать 404
  # на запрос credentials, контейнер падал в цикле и весь пул был мёртв
  image: ghcr.io/mon-ius/docker-warp-socks:v7
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "curl -x socks5://127.0.0.1:9091 -s --max-time 5 https://www.cloudflare.com/cdn-cgi/trace | grep -q warp=on"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 45s

services:
  # Наш бот
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # URL Local Bot API (контейнер bot-api) — файлы до 2 ГБ
      BOT_API_URL: http://bot-api:8081
    depends_on:
      postgres:
        condition: service_healthy
      bot-api:
        condition: service_started
      bgutil:
        condition: service_started
      # только service_started (не healthy): бот сам round-robin'ит по живым WARP
      # в рантайме и уводит битые в кулдаун — жёсткий гейт на один warp был бы SPOF
      warp1:
        condition: service_started
      warp2:
        condition: service_started
      warp3:
        condition: service_started
      warp4:
        condition: service_started
      warp5:
        condition: service_started
    volumes:
      # tmp для скачанных видео (не занимает место в контейнере)
      - /tmp/yt_bot:/tmp/yt_bot
      # cookies для YouTube (обновляются через /update_cookies)
      - ./cookies:/app/cookies
      # доступ к файлам Local Bot API (для /update_cookies)
      - bot-api-data:/var/lib/telegram-bot-api
      # Docker socket — для перезапуска WARP при блокировке IP
      - /var/run/docker.sock:/var/run/docker.sock


  # Local Bot API — файлы до 2 ГБ без ограничений
  bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${API_ID}
      TELEGRAM_API_HASH: ${API_HASH}
      TELEGRAM_LOCAL: 1
    ports:
      - "${BOT_API_PORT:-8081}:8100"
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api
      - /tmp/yt_bot:/tmp/yt_bot

  # PO-token провайдер (bgutil) — снимает "Sign in to confirm you're not a bot" без cookies.
  # Отдельный HTTP-сервер на :4416, плагин yt-dlp в контейнере бота ходит к нему.
  # Без healthcheck намеренно: PO-token best-effort, при недоступности бот качает без токена.
  bgutil:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
    init: true

  # Пул Cloudflare WARP — каждый контейнер регистрируется отдельно → свой exit-IP.
  # Бот round-robin'ит запросы по warp1..warp5 и уводит "битый" IP в кулдаун.
  # RAM: ~50-100 МБ на контейнер → пул из 5 ≈ 0.3-0.5 ГБ. Плюс bgutil (~150-300 МБ).
  # Заложи на хосте ≥2-3 ГБ RAM сверх ОС (5×WARP + bgutil + bot + bot-api + postgres).
  # Меняешь число warpN — синхронно правь WARP_POOL_SIZE в .env.
  warp1:
    <<: *warp-base
  warp2:
    <<: *warp-base
  warp3:
    <<: *warp-base
  warp4:
    <<: *warp-base
  warp5:
    <<: *warp-base

  # Автоперезапуск unhealthy контейнеров (особенно WARP)
  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bot_4_youtube}
      POSTGRES_USER: ${DB_USER:-bot_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bot_user} -d ${DB_NAME:-bot_4_youtube}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  bot-api-data:
